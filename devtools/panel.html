<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="toolbar">
    <button id="refresh">Refresh tree</button>
    <input id="filter" type="search" placeholder="Filter components">
    <label class="check"><input id="hoverHl" type="checkbox" checked> Highlight on hover</label>
    <span id="count"></span>
  </div>
  <div class="split">
    <div id="tree" role="tree"></div>
    <aside id="details">
      <p class="empty">Select a component to see its props and state.</p>
    </aside>
  </div>
  <script src="panel.js"></script>
</body>
</html>
